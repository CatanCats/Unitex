<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unitex Search</title>
<meta name="description" content="Unitex search: results from Wikipedia, Reddit, Hacker News, independent search engines and more, plus every specialist site for houses, jobs, cars and other topics.">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="search" type="application/opensearchdescription+xml" title="Unitex" href="opensearch.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M10 9v9a6 6 0 0 0 12 0V9' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body class="results-page">

<header class="rtop">
  <a class="brand" href="./"><span class="logo" aria-hidden="true">U</span><span class="brand-name">Unitex</span></a>
  <form id="search" class="searchbar compact" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search the web with Unitex…" aria-label="Search query">
    <button class="go" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    </button>
  </form>
  <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
  </button>
</header>

<nav class="rnav">
  <div id="topics" class="quick" aria-label="What are you looking for?"></div>
  <div id="elsewhere" class="quick" aria-label="Search this on"></div>
</nav>

<main class="rmain">
  <div class="rcol">
    <section id="topic-sites" class="topic-sites" hidden></section>
    <p id="status" class="hint status"></p>
    <ol id="results" class="results"></ol>
    <section id="code" class="rsection" hidden>
      <h2>Code &amp; Q&amp;A</h2>
      <ol id="code-results" class="results"></ol>
    </section>
  </div>
  <aside class="rside">
    <section id="answer" class="answer" hidden></section>
    <section id="alts" class="alts" aria-live="polite" hidden></section>
  </aside>
</main>

<footer>
  Unitex asks open sources directly from your browser — Wikipedia, DuckDuckGo, Marginalia, Reddit, Hacker News, Stack Overflow, GitHub and our news feed — and links you to every other engine. Nothing goes through a Unitex server.
  · <a href="./">Home</a> · <a href="https://github.com/CatanCats/Unitex">Source</a>
</footer>

<script src="engines.js?v=3"></script>
<script src="alternatives.js?v=3"></script>
<script src="topics.js?v=3"></script>
<script src="core.js?v=3"></script>
<script src="search.js?v=3"></script>
</body>
</html>
