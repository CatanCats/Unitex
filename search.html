<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unitex Search</title>
<meta name="description" content="Unitex search: results from Wikipedia, Reddit, Hacker News, independent search engines and more, plus the property, job, car and shopping sites for your country.">
<meta name="color-scheme" content="light dark">
<link rel="search" type="application/opensearchdescription+xml" title="Unitex" href="opensearch.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M10 9v9a6 6 0 0 0 12 0V9' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body class="results-page">

<header class="rtop">
  <a class="brand" href="./"><span class="logo" aria-hidden="true">U</span><span class="brand-name">Unitex</span></a>
  <form id="search" class="searchbar compact" role="search" autocomplete="off">
    <select id="dept" class="dept" aria-label="Search in"></select>
    <input id="q" type="search" placeholder="Search the web with Unitex…" aria-label="Search query">
    <button class="go" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    </button>
  </form>
  <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
  </button>
</header>

<nav class="rnav">
  <div id="tabs" class="rtabs" role="tablist"></div>
  <div id="subtabs" class="subtabs" aria-label="Filters" hidden></div>
  <p id="intent-note" class="intent-note" hidden></p>
</nav>

<main class="rmain">
  <div class="rcol">
    <section id="notice" class="notice" role="status" hidden></section>
    <section id="ai-overview" class="ai-card" hidden></section>
    <section id="topic-form" class="topic-form" hidden></section>
    <section id="topic-sites" class="topic-sites ts-row" hidden></section>
    <div id="tab-bar" class="filter-bar tools-row" hidden></div>
    <div class="status-row"><p id="status" class="hint status"></p></div>
    <section id="cards" class="cards" hidden></section>
    <div id="image-strip" class="image-strip" hidden></div>
    <section id="ai-chat" class="ai-chat" hidden></section>
    <p id="did-you-mean" class="did-you-mean" hidden></p>
    <ol id="results" class="results"></ol>
    <section id="related" class="related-box" hidden></section>
    <div id="image-grid" class="image-grid" hidden></div>
    <div id="media-grid" class="media-grid" hidden></div>
  </div>
  <aside class="rside">
    <section id="shortlist" class="shortlist-box" hidden></section>
    <section id="answer" class="answer" hidden></section>
    <section id="alts" class="alts" aria-live="polite" hidden></section>
  </aside>
</main>

<footer>
  Unitex searches from your browser; nothing goes through a Unitex server. · <a href="./">Home</a> · <a href="install.html">Unitex Helper</a> · <a href="test.html">What can my browser read?</a>
</footer>

<script src="version.js?v=33"></script>
<script src="engines.js?v=33"></script>
<script src="alternatives.js?v=33"></script>
<script src="topics.js?v=33"></script>
<script src="core.js?v=33"></script>
<script src="helper.js?v=33"></script>
<script src="listings.js?v=33"></script>
<script src="modes.js?v=33"></script>
<script src="ai.js?v=33"></script>
<script src="tabs.js?v=33"></script>
<script src="livenews.js?v=33"></script>
<script src="jobs.js?v=33"></script>
<script src="sitereaders.js?v=33"></script>
<script src="quality.js?v=33"></script>
<script src="search.js?v=33"></script>
</body>
</html>
