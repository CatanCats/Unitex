name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/news.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python scripts/fetch_news.py
      - name: Commit news.json to main
        run: |
          git config user.name "unitex-news[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
